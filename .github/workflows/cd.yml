name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Incrementar versión en el README
        run: |
          LAST=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
          NEXT=$((LAST + 1))
          FECHA=$(date '+%d/%m/%Y %H:%M')
          echo "- AppVersion-$NEXT - $FECHA" >> README.md

      - name: Commit y push del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "docs: bump de versión"
            git push
          fi

  validate-prod:
    needs: bump-version
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Validar entorno de producción
        shell: powershell
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TOKEN)) {
            Write-Host "ERROR: El secret PROD_TOKEN no está disponible."
            exit 1
          }

          if ([string]::IsNullOrEmpty($env:LOCAL_PROD_TOKEN)) {
            Write-Host "ERROR: LOCAL_PROD_TOKEN no está disponible en el runner."
            exit 1
          }

          if ([string]::Equals(
              $env:TOKEN,
              $env:LOCAL_PROD_TOKEN,
              [StringComparison]::Ordinal
          )) {
            Write-Host "CD: validación de producción correcta — listo para desplegar"
          } else {
            Write-Host "CD: validación fallida: los tokens no coinciden."
            exit 1
          }