name: Prueba de token en runner local

on:
  push:

permissions:
  contents: read

jobs:
  validar-token:
    name: Comparar token de desarrollo
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          GH_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GH_DEV_TOKEN)) {
              Write-Output "ERROR: El secret DEV_TOKEN no está disponible."
              exit 1
          }

          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
              Write-Output "ERROR: LOCAL_DEV_TOKEN no está disponible en el runner."
              exit 1
          }

          if ([string]::Equals(
              $env:GH_DEV_TOKEN,
              $env:LOCAL_DEV_TOKEN,
              [StringComparison]::Ordinal
          )) {
              Write-Output "OK: DEV_TOKEN y LOCAL_DEV_TOKEN coinciden."
          }
          else {
              Write-Output "ERROR: DEV_TOKEN y LOCAL_DEV_TOKEN no coinciden."
              exit 1
          }